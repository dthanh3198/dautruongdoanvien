<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đấu trường Đoàn viên</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
:root{--b:#0b5ed7;--bd:#063c8c;--y:#ffc400;--bg:#eef4ff;--tx:#10213f;--ok:#1a9d52;--no:#d63a3a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.w{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #0b5ed71a}
.hero{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff;text-align:center;border-radius:20px;padding:28px 16px}
.hero h1{margin:0;font-size:30px;color:var(--y)}.hero p{margin:6px 0 0}
button,input,select{font:inherit}
.btn{display:block;width:100%;padding:15px;margin:8px 0;border:0;border-radius:12px;background:var(--b);color:#fff;font-weight:700;font-size:18px;cursor:pointer}
.btn.y{background:var(--y);color:#222}.btn.g{background:#dfe8f7;color:var(--bd)}.btn:disabled{opacity:.45}
input,select{width:100%;padding:13px;margin:6px 0;border:2px solid #cfdcf3;border-radius:12px;font-size:17px}
.pin{font-size:56px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--b)}
.q{font-size:24px;font-weight:700;line-height:1.35;margin:8px 0 14px}
.opt{display:block;width:100%;padding:18px 14px;margin:9px 0;border:3px solid transparent;border-radius:14px;color:#fff;font-size:19px;font-weight:700;text-align:left;cursor:pointer}
.o0{background:#d63a3a}.o1{background:#0b5ed7}.o2{background:#d99a00}.o3{background:#1a9d52}
.opt.dim{opacity:.35}.opt.right{border-color:#000;box-shadow:0 0 0 4px var(--y)}.opt.mine{outline:4px solid #000}
.bar{height:12px;background:#dfe8f7;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--y);width:100%}
.top{display:flex;justify-content:space-between;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid #e6edf9;font-size:18px}
.row.t1{background:#fff4c2;font-weight:800}.row.t2,.row.t3{background:#f2f6fd;font-weight:700}
.x{border:0;background:#fde4e4;color:var(--no);border-radius:8px;padding:4px 10px;cursor:pointer}
.msg{position:sticky;top:0;z-index:9;padding:10px;text-align:center;font-weight:700}
.msg.e{background:var(--no);color:#fff}.msg.w{background:var(--y)}
.c{text-align:center}.big{font-size:60px}
.proj .q{font-size:36px}.proj .opt{font-size:28px}
</style>
</head>
<body>
<div id="msg"></div>
<div class="w" id="app">Đang tải...</div>
<script>
var db, S = {room:null, me:null, players:[], role:null, uid:null, offset:0, q:null, qIdx:-2, cnt:0, ans:null, rev:null, conn:true, sig:'', ending:false, poll:null};
var $app = document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function note(t,k){var m=document.getElementById('msg');m.innerHTML=t?'<div class="msg '+(k||'e')+'">'+esc(t)+'</div>':'';if(t&&k!=='w')setTimeout(function(){m.innerHTML=''},4000)}
async function rpc(n,a){var r=await db.rpc(n,a||{});if(r.error)throw new Error(r.error.message);return r.data}
function link(){return location.origin+location.pathname}

async function init(){
  if(!window.CONFIG||CONFIG.SUPABASE_URL.indexOf('THAY')>=0){$app.innerHTML='<div class="card">Chưa cấu hình. Hãy điền file config.js theo README.</div>';return}
  db=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
  var s=(await db.auth.getSession()).data.session;
  if(!s){var r=await db.auth.signInAnonymously();if(r.error){$app.innerHTML='<div class="card">Không đăng nhập ẩn danh được. Hãy bật "Allow anonymous sign-ins" trong Supabase (xem README).</div>';return}s=r.data.session}
  S.uid=s.user.id;
  var saved=null;try{saved=JSON.parse(localStorage.getItem('dtdv')||'null')}catch(e){}
  if(saved){var r2=await db.from('rooms').select('*').eq('id',saved.id).maybeSingle();if(r2.data&&r2.data.status!=='finished'||(r2.data&&saved.role==='mc')){S.room=r2.data;S.role=saved.role;startSync();return}}
  home();
}
function home(){
  var pin=new URLSearchParams(location.search).get('pin')||'';
  $app.innerHTML='<div class="hero"><div class="big">🎉</div><h1>ĐẤU TRƯỜNG ĐOÀN VIÊN</h1><p>Kết nối thanh niên – Bùng nổ tiếng cười</p></div>'+
  '<div class="card"><b>Tham gia bằng mã PIN</b><input id="pin" inputmode="numeric" maxlength="6" placeholder="Mã PIN 6 số" value="'+esc(pin)+'"><input id="nick" maxlength="20" placeholder="Biệt danh của bạn"><button class="btn y" onclick="join()">Vào phòng</button></div>'+
  '<div class="card"><b>Dành cho MC</b><select id="cnt"><option value="10">10 câu</option><option value="5">5 câu</option><option value="12">12 câu (tối đa bộ mẫu)</option></select><select id="sec"><option value="15">15 giây mỗi câu</option><option value="10">10 giây</option><option value="20">20 giây</option><option value="30">30 giây</option></select><button class="btn" onclick="create()">Tạo phòng chơi</button></div>'+
  '<div class="card"><b>Kho trò chơi</b><p>✅ Trắc nghiệm thần tốc (đã có)<br>⏳ Thật hay thách, Đoán ý đồng đội, Vòng quay may mắn (sắp có)</p></div>'+
  '<div class="card"><b>Hướng dẫn nhanh</b><p>1) MC bấm Tạo phòng và chiếu màn hình lên máy chiếu. 2) Đoàn viên quét QR hoặc nhập mã PIN và biệt danh. 3) MC bấm Bắt đầu. 4) Ai nhanh và đúng nhất được nhiều điểm nhất.</p></div>';
}
async function create(){
  try{S.room=await rpc('create_room',{p_count:+document.getElementById('cnt').value,p_seconds:+document.getElementById('sec').value});S.role='mc';save();startSync()}catch(e){note(e.message)}
}
async function join(){
  try{
    var pin=document.getElementById('pin').value.trim(),nick=document.getElementById('nick').value;
    var p=await rpc('join_room',{p_pin:pin,p_nick:nick});
    var r=await db.from('rooms').select('*').eq('id',p.room_id).single();if(r.error)throw r.error;
    S.room=r.data;S.role='player';save();startSync();
  }catch(e){note(e.message)}
}
function save(){try{localStorage.setItem('dtdv',JSON.stringify({id:S.room.id,role:S.role}))}catch(e){}}
function leave(m){try{localStorage.removeItem('dtdv')}catch(e){}clearInterval(S.poll);S.room=null;S.sig='';S.qIdx=-2;if(m)note(m);home()}

async function syncClock(){var t0=Date.now();var n=await rpc('server_now');S.offset=Date.parse(n)-(t0+Date.now())/2}
function startSync(){
  clearInterval(S.poll);
  var f='room_id=eq.'+S.room.id;
  db.channel('r'+S.room.id)
   .on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:'id=eq.'+S.room.id},refresh)
   .on('postgres_changes',{event:'*',schema:'public',table:'players',filter:f},refresh)
   .on('postgres_changes',{event:'*',schema:'public',table:'answers',filter:f},refresh)
   .subscribe();
  S.poll=setInterval(refresh,3000);  // dự phòng khi Wi-Fi chập chờn
  setInterval(tick,250);
  syncClock().catch(function(){});refresh();
}
var busy=false,again=false;
async function refresh(){
  if(!S.room)return;if(busy){again=true;return}busy=true;
  try{
    var rr=await db.from('rooms').select('*').eq('id',S.room.id).single();if(rr.error)throw rr.error;var room=rr.data;
    var pp=await db.from('players').select('*').eq('room_id',room.id).order('score',{ascending:false}).order('correct_count',{ascending:false}).order('joined_at');if(pp.error)throw pp.error;
    S.players=pp.data;S.me=S.players.find(function(p){return p.user_id===S.uid})||null;
    if(S.role==='player'&&!S.me){leave('Bạn không còn trong phòng này (có thể MC đã mời ra).');return}
    if(room.q_index!==S.qIdx){S.qIdx=room.q_index;S.q=null;S.rev=null;S.ans=null;S.ending=false;
      if(room.q_index>=0){var q=await db.from('questions').select('id,topic,body,options').eq('id',room.q_ids[room.q_index]).single();if(q.error)throw q.error;S.q=q.data}
      if(room.status==='question')await syncClock().catch(function(){})}
    if(room.status==='question'||room.status==='reveal'){
      if(S.role==='player'&&S.me){var a=await db.from('answers').select('choice,points').eq('player_id',S.me.id).eq('q_index',room.q_index).maybeSingle();S.ans=a.data}
      if(S.role==='mc'){var c=await db.from('answers').select('id',{count:'exact',head:true}).eq('room_id',room.id).eq('q_index',room.q_index);S.cnt=c.count||0}
    }
    if((room.status==='reveal')&&!S.rev){var rv=await rpc('get_reveal',{p_room:room.id});S.rev=rv[0]||null}
    S.room=room;if(!S.conn){S.conn=true}note('');
    var sig=JSON.stringify([room.status,room.q_index,S.players.map(function(p){return [p.id,p.score,p.nickname]}),S.cnt,S.ans,S.rev,!!S.q]);
    if(sig!==S.sig){S.sig=sig;render()}
  }catch(e){S.conn=false;note('Mất kết nối, đang thử lại...','w')}
  finally{busy=false;if(again){again=false;refresh()}}
}
function left(){return (Date.parse(S.room.q_ends_at)-(Date.now()+S.offset))/1000}
function tick(){
  if(!S.room||S.room.status!=='question')return;
  var l=Math.max(0,left()),t=document.getElementById('tm'),b=document.getElementById('bar');
  if(t)t.textContent='⏱ '+Math.ceil(l)+'s';if(b)b.style.width=(100*l/S.room.q_seconds)+'%';
  if(l<=0){document.querySelectorAll('.opt').forEach(function(o){o.disabled=true});
    if(S.role==='mc'&&!S.ending){S.ending=true;rpc('end_question',{p_room:S.room.id}).then(refresh).catch(function(){S.ending=false})}}
}
function board(n){
  var h='';S.players.slice(0,n||999).forEach(function(p,i){
    var me=S.me&&p.id===S.me.id;
    h+='<div class="row '+(i<3?'t'+(i+1):'')+'"><span>'+(['🥇','🥈','🥉'][i]||(i+1)+'.')+' '+esc(p.nickname)+(me?' (bạn)':'')+'</span><span>'+p.score+' đ · '+p.correct_count+' ✓</span></div>'});
  return h||'<p>Chưa có người chơi.</p>';
}
function opts(reveal,mine){
  var h='';S.q.options.forEach(function(o,i){
    var cl='opt o'+i;
    if(reveal){cl+=(S.rev&&S.rev.correct===i)?' right':' dim';if(mine&&mine.choice===i)cl+=' mine'}
    else if(mine&&mine.choice===i)cl+=' mine';
    var click=(!reveal&&S.role==='player'&&!mine)?' onclick="answer('+i+')"':' disabled';
    h+='<button class="'+cl+'"'+click+'>'+'ABCD'[i]+'. '+esc(o)+'</button>'});
  return h;
}
function render(){
  var r=S.room,mc=S.role==='mc',h='';
  if(r.status==='lobby'){
    if(mc){h='<div class="card c"><p>Quét QR hoặc vào '+esc(link())+' và nhập mã PIN</p><div class="pin">'+r.pin+'</div><div id="qr" style="display:flex;justify-content:center;margin:10px"></div></div>'+
      '<div class="card"><b>Người chơi: '+S.players.length+'</b>'+S.players.map(function(p){return '<div class="row"><span>'+esc(p.nickname)+'</span><button class="x" onclick="kick(\''+p.id+'\')">Mời ra</button></div>'}).join('')+
      '<button class="btn y" '+(S.players.length?'':'disabled')+' onclick="next()">Bắt đầu trò chơi</button><button class="btn g" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">Toàn màn hình (chiếu)</button></div>'}
    else h='<div class="card c"><div class="big">✅</div><h2>Bạn đã vào phòng, '+esc(S.me.nickname)+'</h2><p>Đang chờ MC bắt đầu... Hiện có '+S.players.length+' người.</p></div>';
  }else if(r.status==='question'&&S.q){
    var l=Math.max(0,Math.ceil(left()));
    h='<div class="card '+(mc?'proj':'')+'"><div class="top"><span>Câu '+(r.q_index+1)+'/'+r.q_ids.length+'</span><span id="tm">⏱ '+l+'s</span></div><div class="bar"><i id="bar"></i></div><div class="q">'+esc(S.q.body)+'</div>'+opts(false,S.ans)+
      (mc?'<p class="c"><b>'+S.cnt+'/'+S.players.length+'</b> đã trả lời</p><button class="btn g" onclick="endQ()">Kết thúc câu ngay</button>':(S.ans?'<p class="c"><b>Đã gửi đáp án!</b> Chờ kết quả...</p>':''))+'</div>';
  }else if(r.status==='reveal'&&S.q){
    var ok=S.ans&&S.rev&&S.ans.choice===S.rev.correct;
    h='<div class="card '+(mc?'proj':'')+'"><div class="q">'+esc(S.q.body)+'</div>'+opts(true,S.ans)+
      (S.rev?'<p>💡 '+esc(S.rev.explanation)+'</p>':'')+
      (!mc?'<h2 class="c">'+(S.ans?(ok?'🎉 Đúng! +'+S.ans.points+' điểm':'😅 Chưa đúng'):'⏰ Bạn chưa trả lời')+'</h2>':'')+'</div>'+
      '<div class="card"><b>Bảng xếp hạng</b>'+board(mc?8:5)+(mc?'<button class="btn y" onclick="next()">'+(r.q_index+1>=r.q_ids.length?'Xem kết quả chung cuộc':'Câu tiếp theo')+'</button>':'')+'</div>';
  }else if(r.status==='finished'){
    h='<div class="card c"><div class="big">🏆</div><h1>Chung cuộc</h1>'+(S.players[0]?'<h2>Quán quân: '+esc(S.players[0].nickname)+'</h2>':'')+'</div><div class="card">'+board()+'</div>'+
      '<button class="btn g" onclick="leave()">Về trang chủ</button>';
  }else h='<div class="card c">Đang tải...</div>';
  $app.innerHTML=h;
  var qr=document.getElementById('qr');if(qr)new QRCode(qr,{text:link()+'?pin='+r.pin,width:220,height:220});
  tick();
}
async function answer(i){
  S.ans={choice:i,points:0};render();  // hiện ngay, máy chủ vẫn là nơi chấm điểm
  try{await rpc('submit_answer',{p_room:S.room.id,p_choice:i})}catch(e){note(e.message);S.ans=null}
  refresh();
}
async function next(){try{await rpc('start_question',{p_room:S.room.id,p_idx:S.room.q_index+1});refresh()}catch(e){note(e.message)}}
async function endQ(){try{await rpc('end_question',{p_room:S.room.id});refresh()}catch(e){note(e.message)}}
async function kick(id){if(confirm('Mời người này ra khỏi phòng?')){try{await rpc('kick_player',{p_player:id});refresh()}catch(e){note(e.message)}}}
init();
</script>
</body>
</html>
